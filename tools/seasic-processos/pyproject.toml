[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seasic-processos"
version = "0.1.0"
description = "Monitoramento local, somente leitura, de processos SEI/e-DOC"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]

[project.scripts]
seasic-monitor = "seasic_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

