[database]
path = "data/processos.sqlite"

[monitor]
# Dias corridos. Ajustar para dias úteis somente após decisão do Gabinete.
stagnant_after_days = 30

# Será usado pelos coletores reais somente após autorização institucional.
min_interval_seconds = 5
max_processes_per_run = 500
# Teto por sistema somando todas as execuções do dia (horário de Brasília).
max_processes_per_day = 500
# Falhas técnicas seguidas (erro de extração, sistema indisponível) que interrompem a rodada.
max_consecutive_failures = 3
# Janela permitida, horário de Brasília, ex.: "05:00-08:00". Vazio = sem restrição.
allowed_hours = ""

[collectors.SEI]
enabled = false
# true só para run/consultar sem janela; login sempre abre o navegador visível.
headless = false
entry_url = ""
profile_path = "browser_profiles/sei"
# Processo de referência consultado primeiro; se falhar, a rodada para (layout mudou).
# Precisa estar ativo no Cadastro Mestre. Vazio = sem processo de referência.
canary = ""

[collectors.SEI.selectors]
process_input = ""
search_button = ""
result_ready = ""
result_row = ""
process_number_cell = ""
detail_link = ""
detail_ready = ""
units_open = ""
last_movement = ""
movement_date = ""
no_result = ""
session_expired = ""

# O SEI mostra árvore e conteúdo do processo em iframes. Para cada seletor que
# está dentro de um iframe, indique o seletor do iframe (ou uma lista, do mais
# externo ao mais interno). Ex.: units_open = "#ifrVisualizacao"
[collectors.SEI.frames]

[collectors.EDOC]
enabled = false
# true só para run/consultar sem janela; login sempre abre o navegador visível.
headless = false
entry_url = ""
profile_path = "browser_profiles/edoc"
# Processo de referência consultado primeiro; se falhar, a rodada para (layout mudou).
# Precisa estar ativo no Cadastro Mestre. Vazio = sem processo de referência.
canary = ""

[collectors.EDOC.selectors]
process_input = ""
search_button = ""
result_ready = ""
# Preencha os quatro seletores seguintes apenas se busca e detalhe forem telas separadas.
result_row = ""
process_number_cell = ""
detail_link = ""
detail_ready = ""
units_open = ""
last_movement = ""
movement_date = ""
no_result = ""
session_expired = ""

